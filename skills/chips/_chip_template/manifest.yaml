# 芯片包 · 最小原型（prototype）
#
# 这是「能让骨架跑起来」的最少字段，不是原项目的完整结构。
# 原项目有更完整的字段（继承关系 / 时钟树 / 电压 / 外设清单 / 封装等），
# 见 docs/DATA_SPEC.md 参考——但你不必照搬，够用就行，爱咋做咋做。
#
# 一份芯片肖像 = 一个目录，目录名 = 芯片名。

name: _example_chip            # 芯片名（目录名同此，如 stm32f407zgt6）

chip:
  family: F4                   # 系列（F1/F4/G4），决定 HAL 前缀与时钟基准
  core: Cortex-M4F             # 内核

hal:
  library: STM32Cube_FW_F4     # HAL 库名（决定源文件前缀 stm32f4xx）

files:
  profile: profile.json        # 芯片画像（引脚 / 复用功能，见下）
